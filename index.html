<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Multichain Wallet dApp</title>

  <!-- Web3Modal v3 — WalletConnect official method -->
  <script type="module">
    import { createWeb3Modal, defaultConfig } from "https://unpkg.com/@web3modal/wagmi@3.5.2/dist/wagmi.js";

    const projectId = "a50e4d7d1e8b4d111c564ffde1234567"; // replace later

    const metadata = {
      name: "Premium dApp",
      description: "WalletConnect v2 Working 2025",
      url: "https://walletbep.github.io",
      icons: ["https://walletconnect.com/walletconnect-logo.png"]
    };

    const chains = [
      { id: 1, name: "Ethereum", rpcUrls: { default: { http: ["https://rpc.ankr.com/eth"] } } },
      { id: 56, name: "BNB Chain", rpcUrls: { default: { http: ["https://bsc-dataseed.binance.org"] } } },
      { id: 137, name: "Polygon", rpcUrls: { default: { http: ["https://polygon-rpc.com"] } } }
    ];

    const wagmiConfig = defaultConfig({
      chains,
      projectId,
      metadata
    });

    createWeb3Modal({
      wagmiConfig,
      projectId,
      chains
    });

    window.openModal = () => {
      const modal = document.querySelector('w3m-button');
      modal.click();
    };
  </script>

  <style>
    body{ background:#0b0f26; color:white; text-align:center; font-family:Arial; }
    #btn{ padding:14px 28px; background:#4c8cff; font-size:22px; border-radius:10px; cursor:pointer; margin-top:40px; }
  </style>

</head>

<body>
  <h1>Premium WalletConnect v2 dApp (2025 Working)</h1>

  <button id="btn" onclick="openModal()">Connect Wallet</button>

  <w3m-button></w3m-button>

</body>
</html>
